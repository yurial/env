# tmux 3.4 вместо серверного GNU screen 4.09.01
# (screen усекает UTF-8 OSC-титул до младших байтов: «Подсчёт» -> ">4AGQB")

# Префикс C-x — зеркало screen escape ^Xx; внешний screen на macOS
# глотает C-a, поэтому tmux должен получать C-x
set -g prefix C-x
unbind C-b
bind x send-prefix
# C-x x шлёт литеральный C-x приложению (как screen bind x)

# Тема yurial.json из .config/opencode/themes рассчитана на TERM=screen-256color
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',*:Tc'
# true color

set -s set-clipboard on
# доезжание OSC 52 (буфер обмена) от opencode

set -sg escape-time 10
# без задержки Esc в TUI

set -g focus-events on
# opentui-уведомления срабатывают по blur

set -g history-limit 50000
# запас скроллбэка

# Внешний титул терминала не трогаем (mac-screen может исказить);
# вкладки (окна в статус-строке) следуют титулам приложений
set -g set-titles off
set -g allow-rename on

# Статус-строка в духе screen-хардстатуса: зелёная полоса, список окон,
# текущее окно подсвечено красным
set -g status-style bg=colour2,fg=black
set -g window-status-format "#[fg=black,bg=colour7] #I #W "
set -g window-status-current-format "#[fg=white,bg=colour1] #I #W "
